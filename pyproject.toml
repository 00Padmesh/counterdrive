[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "counterdrive"
version = "0.1.0"
description = "Student-scale action-conditioned driving world model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "torchvision>=0.16",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.5"]
nuscenes = ["nuscenes-devkit>=1.1.11"]

[project.scripts]
counterdrive-train = "counterdrive.train:main"
counterdrive-evaluate = "counterdrive.evaluate:main"
counterdrive-api = "counterdrive.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

