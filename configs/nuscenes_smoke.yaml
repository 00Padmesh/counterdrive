seed: 42
device: auto
data:
  backend: nuscenes
  root: /content/drive/MyDrive/CounterDrive/data/nuscenes
  version: v1.0-mini
  sequence_length: 4
  future_steps: 6
  image_size: 96
  num_workers: 2
  cache_dir: /content/drive/MyDrive/CounterDrive/cache/nuscenes_mini
  use_cache: true
  validation_fraction: 0.2
model:
  pretrained: true
  freeze_vision: true
  unfreeze_layer4: false
  latent_dim: 64
  action_dim: 3
  transformer_layers: 1
  transformer_heads: 4
  dropout: 0.1
  action_conditioned: true
  use_kinematic_residual: true
training:
  epochs: 1
  batch_size: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  trajectory_loss_weight: 1.0
  collision_loss_weight: 1.0
  latent_loss_weight: 0.05
  checkpoint_dir: /content/drive/MyDrive/CounterDrive/checkpoints/nuscenes_residual_smoke
  mixed_precision: true
  gradient_clip_norm: 1.0
  scheduler_patience: 2
  scheduler_factor: 0.5
  early_stopping_patience: 5
  collision_positive_weight: 4.0
  monitor: ade
