seed: 42
device: auto
data:
  backend: synthetic
  sequence_length: 4
  future_steps: 6
  image_size: 96
  train_samples: 2048
  val_samples: 512
  num_workers: 2
  collision_fraction: 0.35
model:
  pretrained: true
  freeze_vision: true
  unfreeze_layer4: false
  latent_dim: 128
  action_dim: 3
  transformer_layers: 2
  transformer_heads: 4
  dropout: 0.1
  action_conditioned: false
training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  trajectory_loss_weight: 1.0
  collision_loss_weight: 0.5
  latent_loss_weight: 0.1
  checkpoint_dir: /content/drive/MyDrive/CounterDrive/checkpoints/baseline
  mixed_precision: true
  gradient_clip_norm: 1.0
  scheduler_patience: 2
  scheduler_factor: 0.5
  early_stopping_patience: 5
  collision_positive_weight: 2.0
  monitor: ade
